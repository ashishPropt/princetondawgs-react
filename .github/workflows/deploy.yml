name: Deploy to Vultr

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build React client
        run: |
          cd client
          npm ci
          VITE_API_URL=/api npm run build

      - name: Copy build to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USER }}
          key: ${{ secrets.VULTR_SSH_KEY }}
          source: 'client/dist/*'
          target: '/home/${{ secrets.VULTR_USER }}/princetondawgs/client/dist'
          strip_components: 2

      - name: Deploy server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USER }}
          key: ${{ secrets.VULTR_SSH_KEY }}
          script: |
            set -e
            cd /home/${{ secrets.VULTR_USER }}/princetondawgs
            git pull origin main
            cd server && npm ci --omit=dev
            pm2 restart princetondawgs || pm2 start index.js --name princetondawgs
            pm2 save
            echo "Deploy complete at $(date)"
